<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Life Dashboard</title>
<meta name="description" content="Christian's life dashboard" />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Dashboard" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" type="image/png" />

<style>
  :root {
    --bg: #FAF8F5;
    --ink: #2C2825;
    --ink-2: #8A8279;
    --ink-3: #B5AFA8;
    --hairline: rgba(120, 100, 80, 0.14);
    --well: rgba(120, 100, 80, 0.05);
    --good: #5B9A6F;
    --warning: #C68B4B;
    --critical: #C45C4A;
    --info: #5B8DB8;
    --neutral: #B5AFA8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171512;
      --ink: #EDEAE5;
      --ink-2: #9B948B;
      --ink-3: #6E675F;
      --hairline: rgba(255, 255, 255, 0.10);
      --well: rgba(255, 255, 255, 0.04);
      --good: #79B08C;
      --warning: #D9A05F;
      --critical: #D97965;
      --info: #7FA9CC;
      --neutral: #6E675F;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { background: var(--bg); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  body { overflow-x: hidden; }
  .app { max-width: 640px; margin: 0 auto; padding: 24px 20px 48px; }

  section { padding: 20px 0; border-top: 1px solid var(--hairline); }
  section:first-of-type { border-top: none; padding-top: 0; }

  .label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-2); margin-bottom: 12px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  }
  .label .flag { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink-3); }

  /* status color hook: each level sets --c */
  .lv-good { --c: var(--good); }
  .lv-warning { --c: var(--warning); }
  .lv-critical { --c: var(--critical); }
  .lv-info { --c: var(--info); }
  .lv-neutral { --c: var(--neutral); }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--neutral)); flex-shrink: 0; }

  /* ---------- header ---------- */
  .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .date { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
  .greeting { font-size: 21px; font-weight: 650; letter-spacing: -0.01em; margin-top: 2px; }
  .hero { text-align: right; }
  .hero-value { font-size: 48px; font-weight: 650; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
  .hero-value small { font-size: 15px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
  .hero-label { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

  /* ---------- focus ---------- */
  .focus-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 0;
    cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .focus-check {
    width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid var(--hairline);
    flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .focus-item .dot { margin-top: 7px; }
  .focus-text { font-size: 14px; }
  .focus-item.done { opacity: 0.4; }
  .focus-item.done .focus-text { text-decoration: line-through; }
  .focus-item.done .focus-check { background: var(--good); border-color: var(--good); }

  /* ---------- stat tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
  .tile { background: var(--well); border-radius: 10px; padding: 10px 12px; }
  .tile-label { font-size: 11px; color: var(--ink-2); }
  .tile-value { font-size: 19px; font-weight: 650; margin-top: 2px; letter-spacing: -0.01em; }
  .tile-sub { font-size: 11px; color: var(--ink-2); margin-top: 1px; display: flex; align-items: center; gap: 5px; }

  /* ---------- training ---------- */
  .train-line { font-size: 14px; margin-bottom: 4px; }
  .train-line b { font-weight: 650; }
  .train-sub { font-size: 12px; color: var(--ink-2); margin-bottom: 12px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .week-cell {
    border-radius: 8px; padding: 7px 2px; text-align: center; cursor: pointer;
    background: var(--well); user-select: none; -webkit-user-select: none; min-width: 0;
  }
  .week-cell .d { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-2); }
  .week-cell .w { font-size: 11px; font-weight: 500; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .week-cell.today { box-shadow: inset 0 0 0 1.5px var(--info); }
  .week-cell.today .d { color: var(--info); }
  .week-cell.selected:not(.today) { box-shadow: inset 0 0 0 1.5px var(--hairline); }
  .week-detail { font-size: 12.5px; color: var(--ink-2); margin-top: 10px; }
  .week-detail b { color: var(--ink); font-weight: 600; }

  /* ---------- money ---------- */
  .rev { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; }
  .rev-label { font-size: 14px; }
  .rev-sub { font-size: 12px; color: var(--ink-2); }
  .rev-value { font-size: 19px; font-weight: 650; }
  .bill {
    display: flex; align-items: center; gap: 10px; padding: 9px 0;
    border-top: 1px solid var(--hairline); cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .bill-name { font-size: 14px; flex: 1; min-width: 0; }
  .bill-due { font-size: 12px; color: var(--ink-2); }
  .bill-amount { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; min-width: 56px; }
  .pill {
    font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: color-mix(in srgb, var(--c) 14%, transparent);
    color: var(--ink); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .pill .dot { width: 6px; height: 6px; }
  .bill.paid .bill-name, .bill.paid .bill-amount, .bill.paid .bill-due { text-decoration: line-through; color: var(--ink-3); }

  /* ---------- pillars ---------- */
  .pillar { padding: 8px 0; }
  .pillar-top { display: flex; align-items: baseline; gap: 8px; }
  .pillar-name { font-size: 14px; font-weight: 600; }
  .pillar-status { font-size: 12px; color: var(--ink-2); flex: 1; display: inline-flex; align-items: center; gap: 6px; }
  .pillar-score { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .meter { height: 4px; border-radius: 2px; margin-top: 6px; background: color-mix(in srgb, var(--c) 16%, transparent); overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 2px; background: var(--c); width: 0%; transition: width 0.8s cubic-bezier(.4,0,.2,1); }

  /* ---------- footer ---------- */
  .footer { padding-top: 20px; border-top: 1px solid var(--hairline); text-align: center; }
  .footer div { font-size: 12px; color: var(--ink-3); }

  .error {
    font-size: 13px; color: var(--critical); padding: 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--critical) 10%, transparent); margin-bottom: 16px; display: none;
  }
  .error.show { display: block; }
</style>
</head>
<body>
<div class="app">
  <div class="error" id="error"></div>
  <section><div class="header" id="header"></div></section>
  <section><div class="label">Focus today</div><div id="focus"></div></section>
  <section><div class="label">Recovery<span class="flag" id="whoopFlag"></span></div><div id="whoop"></div></section>
  <section><div class="label">Training</div><div id="training"></div></section>
  <section><div class="label">Money</div><div id="money"></div></section>
  <section><div class="label">Pillars</div><div id="pillars"></div></section>
  <footer class="footer" id="footer"></footer>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const TZ = "Australia/Brisbane";
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const CHECK = '<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

function brisbaneNow() {
  return new Date(new Date().toLocaleString("en-US", { timeZone: TZ }));
}
function todayKey() {
  const d = brisbaneNow();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function store(key, value) {
  try {
    if (value === undefined) return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key, JSON.stringify(value));
  } catch { return null; }
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ---------- header ---------- */
function renderHeader(data) {
  const now = brisbaneNow();
  const hour = now.getHours();
  const greeting = hour >= 17 || hour < 5 ? "Good evening" : hour >= 12 ? "Good afternoon" : "Good morning";
  const dateStr = now.toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long" });
  const score = Math.round(data.pillars.reduce((sum, p) => sum + p.score * p.weight, 0));

  $("header").innerHTML = `
    <div>
      <div class="date">${dateStr}</div>
      <div class="greeting">${greeting}, ${esc(data.user.name)}</div>
    </div>
    <div class="hero">
      <div class="hero-value">${score}<small> / 100</small></div>
      <div class="hero-label">Life score</div>
    </div>
  `;
}

/* ---------- focus (checked state kept per day) ---------- */
function renderFocus(data) {
  const key = `ld:focus:${todayKey()}`;
  const done = store(key) || [];
  $("focus").innerHTML = data.focusToday.map((f, i) => `
    <div class="focus-item lv-${f.level} ${done[i] ? "done" : ""}" data-i="${i}">
      <span class="focus-check">${done[i] ? CHECK : ""}</span>
      <span class="dot"></span>
      <span class="focus-text">${esc(f.text)}</span>
    </div>
  `).join("");

  $("focus").querySelectorAll(".focus-item").forEach((item) => {
    item.addEventListener("click", () => {
      const i = +item.dataset.i;
      const done = store(key) || [];
      done[i] = !done[i];
      store(key, done);
      item.classList.toggle("done", done[i]);
      item.querySelector(".focus-check").innerHTML = done[i] ? CHECK : "";
    });
  });
}

/* ---------- whoop (live from whoop-data.json) ---------- */
function renderWhoop(whoop) {
  if (!whoop || !whoop.recovery) {
    $("whoop").innerHTML = `<div class="tile-sub">No WHOOP data — run whoop_sync.py</div>`;
    $("whoopFlag").textContent = "";
    return;
  }
  const rec = Math.round(whoop.recovery.recovery_score);
  const band = rec >= 67 ? ["Recovered", "good"] : rec >= 34 ? ["Moderate", "warning"] : ["Low", "critical"];

  const synced = new Date(whoop.synced_at);
  const ageH = (Date.now() - synced) / 3600000;
  const syncedStr = synced.toLocaleDateString("en-AU", { day: "numeric", month: "short", timeZone: TZ });
  $("whoopFlag").textContent = ageH > 36 ? `Stale — synced ${syncedStr}` : `Synced ${syncedStr}`;

  const tiles = [
    { label: "Recovery", value: `${rec}%`, sub: band[0], level: band[1] },
    { label: "Sleep", value: `${Math.round(whoop.sleep.sleep_score)}%` },
    { label: "Strain", value: whoop.strain.strain_score.toFixed(1), sub: "of 21" },
    { label: "HRV", value: `${Math.round(whoop.recovery.hrv_ms)}`, sub: "ms" },
    { label: "Resting HR", value: `${Math.round(whoop.recovery.resting_heart_rate)}`, sub: "bpm" },
  ];
  $("whoop").innerHTML = `<div class="tiles">${tiles.map((t) => `
    <div class="tile">
      <div class="tile-label">${t.label}</div>
      <div class="tile-value">${t.value}</div>
      ${t.sub ? `<div class="tile-sub ${t.level ? `lv-${t.level}` : ""}">${t.level ? '<span class="dot"></span>' : ""}${t.sub}</div>` : ""}
    </div>
  `).join("")}</div>`;
}

/* ---------- training (countdown + week computed from real calendar) ---------- */
function renderTraining(data) {
  const m = data.marathon;
  const now = brisbaneNow();
  const race = new Date(`${m.raceDate}T00:00:00+10:00`);
  const daysOut = Math.ceil((race - now) / 86400000);
  const raceStr = race.toLocaleDateString("en-AU", { day: "numeric", month: "short", timeZone: TZ });

  let line, sub;
  if (daysOut < 0) {
    line = `<b>${esc(m.name)}</b> — raced ${raceStr}`;
    sub = "Race day has passed — set the next goal in data.json.";
  } else {
    const week = Math.min(m.blockWeeks, Math.max(1, m.blockWeeks - Math.ceil(daysOut / 7) + 1));
    line = `<b>${esc(m.name)}</b> — ${daysOut === 0 ? "race day" : `${daysOut} day${daysOut === 1 ? "" : "s"} to go`} · ${raceStr}`;
    sub = `Week ${week} of ${m.blockWeeks} · ${esc(m.goal)}`;
  }

  const todayAbbr = DAYS[now.getDay()];
  const todayIdx = data.week.findIndex((w) => w.day === todayAbbr);

  $("training").innerHTML = `
    <div class="train-line">${line}</div>
    <div class="train-sub">${sub}</div>
    <div class="week" id="weekStrip">${data.week.map((w, i) => `
      <div class="week-cell ${i === todayIdx ? "today selected" : ""}" data-i="${i}">
        <div class="d">${w.day}</div>
        <div class="w">${esc(w.workout)}</div>
      </div>
    `).join("")}</div>
    <div class="week-detail" id="weekDetail"></div>
  `;

  const detail = $("weekDetail");
  const show = (i) => { detail.innerHTML = `<b>${data.week[i].day}</b> — ${esc(data.week[i].detail)}`; };
  show(todayIdx >= 0 ? todayIdx : 0);

  $("weekStrip").querySelectorAll(".week-cell").forEach((cell) => {
    cell.addEventListener("click", () => {
      $("weekStrip").querySelectorAll(".week-cell").forEach((c) => c.classList.remove("selected"));
      cell.classList.add("selected");
      show(+cell.dataset.i);
    });
  });
}

/* ---------- money (tap a bill to mark paid; kept per day) ---------- */
function renderMoney(data) {
  const key = `ld:paid:${todayKey()}`;
  const paid = store(key) || {};
  const rev = data.money.revenue;

  const pillFor = (b) =>
    b.status === "overdue" ? `<span class="pill lv-critical"><span class="dot"></span>Overdue</span>`
    : b.status === "due-today" ? `<span class="pill lv-warning"><span class="dot"></span>Due today</span>`
    : `<span class="pill lv-neutral"><span class="dot"></span>Upcoming</span>`;

  $("money").innerHTML = `
    <div class="rev">
      <div>
        <div class="rev-label">${esc(rev.label)}</div>
        <div class="rev-sub">${esc(rev.sub)}</div>
      </div>
      <div class="rev-value">${esc(rev.value)}</div>
    </div>
    ${data.money.bills.map((b, i) => `
      <div class="bill ${paid[b.name] ? "paid" : ""}" data-name="${esc(b.name)}">
        <div class="bill-name">${esc(b.name)}<span class="bill-due"> · ${esc(b.due)}</span></div>
        ${paid[b.name] ? `<span class="pill lv-good">${CHECK}Paid</span>` : pillFor(b)}
        <div class="bill-amount">${esc(b.amount)}</div>
      </div>
    `).join("")}
  `;

  $("money").querySelectorAll(".bill").forEach((row, i) => {
    row.addEventListener("click", () => {
      const paid = store(key) || {};
      const name = data.money.bills[i].name;
      paid[name] = !paid[name];
      store(key, paid);
      row.classList.toggle("paid", !!paid[name]);
      row.querySelector(".pill").outerHTML = paid[name]
        ? `<span class="pill lv-good">${CHECK}Paid</span>`
        : pillFor(data.money.bills[i]);
    });
  });
}

/* ---------- pillars ---------- */
function renderPillars(data) {
  $("pillars").innerHTML = data.pillars.map((p) => `
    <div class="pillar lv-${p.level}">
      <div class="pillar-top">
        <span class="pillar-name">${esc(p.name)}</span>
        <span class="pillar-status"><span class="dot"></span>${esc(p.status)}</span>
        <span class="pillar-score">${p.score}</span>
      </div>
      <div class="meter"><div class="meter-fill" data-pct="${p.score}"></div></div>
    </div>
  `).join("");

  requestAnimationFrame(() => requestAnimationFrame(() => {
    $("pillars").querySelectorAll(".meter-fill").forEach((el) => {
      el.style.width = `${el.dataset.pct}%`;
    });
  }));
}

/* ---------- footer ---------- */
function renderFooter(data) {
  const updated = new Date(data.meta.updatedAt);
  const str = updated.toLocaleString("en-AU", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit", timeZone: TZ });
  $("footer").innerHTML = `<div>Data updated ${str}</div><div>${esc(data.meta.sources)}</div>`;
}

/* =========================================================
   LOAD + AUTO-REFRESH
   data.json and whoop-data.json are fetched fresh (no cache)
   on load, whenever the app regains focus, and every 5 min —
   so a redeploy shows up without reinstalling or hard-reloading.
   ========================================================= */
let rendered = false;

async function refresh() {
  let data, whoop;
  try {
    [data, whoop] = await Promise.all([
      fetch("data.json", { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch("whoop-data.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
    ]);
  } catch (e) {
    if (!rendered) $("error").classList.add("show"), $("error").textContent = `Couldn't load dashboard data (${e.message}). Retrying automatically.`;
    return;
  }
  $("error").classList.remove("show");
  renderHeader(data);
  renderFocus(data);
  renderWhoop(whoop);
  renderTraining(data);
  renderMoney(data);
  renderPillars(data);
  renderFooter(data);
  rendered = true;
}

refresh();
setInterval(refresh, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refresh();
});

// network-first service worker: the installed home-screen app always
// fetches the live page instead of a stale cached copy
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
