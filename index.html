<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Life Dashboard</title>
<meta name="description" content="Christian's daily briefing" />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Dashboard" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" type="image/png" />

<style>
  :root {
    --bg: #FAF8F5;
    --card: #FFFFFF;
    --ink: #2C2825;
    --ink-2: #8A8279;
    --ink-3: #B5AFA8;
    --hairline: rgba(120, 100, 80, 0.14);
    --well: rgba(120, 100, 80, 0.05);
    --good: #5B9A6F;
    --warning: #C68B4B;
    --critical: #C45C4A;
    --info: #5B8DB8;
    --neutral: #B5AFA8;
    --shadow: 0 2px 12px rgba(120, 100, 80, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171512;
      --card: #201D19;
      --ink: #EDEAE5;
      --ink-2: #9B948B;
      --ink-3: #6E675F;
      --hairline: rgba(255, 255, 255, 0.10);
      --well: rgba(255, 255, 255, 0.04);
      --good: #79B08C;
      --warning: #D9A05F;
      --critical: #D97965;
      --info: #7FA9CC;
      --neutral: #6E675F;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { background: var(--bg); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top);
    overflow-x: hidden;
  }

  .app { max-width: 600px; margin: 0 auto; padding: 24px 20px 120px; }

  section { padding: 20px 0; border-top: 1px solid var(--hairline); }
  section:first-of-type { border-top: none; padding-top: 0; }

  .label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-2); margin-bottom: 12px;
  }

  .lv-good { --c: var(--good); }
  .lv-warning { --c: var(--warning); }
  .lv-critical { --c: var(--critical); }
  .lv-info { --c: var(--info); }
  .lv-neutral { --c: var(--neutral); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--neutral)); flex-shrink: 0; }

  /* ---------- header ---------- */
  .date { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
  .greeting { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; margin-top: 2px; }
  .stale-note { font-size: 12px; color: var(--warning); margin-top: 6px; }

  /* ---------- briefing ---------- */
  .briefing p {
    font-size: 15.5px; line-height: 1.65; margin-bottom: 14px;
  }
  .briefing p:last-child { margin-bottom: 0; }

  /* ---------- today checklist ---------- */
  .today-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 9px 0;
    cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .today-check {
    width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--hairline);
    flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .today-item .dot { margin-top: 8px; }
  .today-text { font-size: 14.5px; }
  .today-item.done { opacity: 0.4; }
  .today-item.done .today-text { text-decoration: line-through; }
  .today-item.done .today-check { background: var(--good); border-color: var(--good); }

  /* ---------- numbers ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
  .tile { background: var(--well); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .tile-label { font-size: 11px; color: var(--ink-2); }
  .tile-value { font-size: 19px; font-weight: 650; margin-top: 2px; letter-spacing: -0.01em; white-space: nowrap; }
  .tile-note { font-size: 11px; color: var(--ink-2); margin-top: 1px; display: flex; align-items: center; gap: 5px; }
  .tile-note .dot { width: 6px; height: 6px; }

  /* ---------- radar ---------- */
  .radar-item {
    display: flex; gap: 10px; padding: 7px 0;
    font-size: 13px; color: var(--ink-2); line-height: 1.5;
  }
  .radar-item::before { content: "—"; color: var(--ink-3); flex-shrink: 0; }

  /* ---------- footer ---------- */
  .footer { padding-top: 20px; border-top: 1px solid var(--hairline); text-align: center; }
  .footer div { font-size: 12px; color: var(--ink-3); }

  .error {
    font-size: 13px; color: var(--critical); padding: 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--critical) 10%, transparent); margin-bottom: 16px; display: none;
  }
  .error.show { display: block; }

  /* ---------- reply bar ---------- */
  .reply-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 75%, transparent);
    display: flex; justify-content: center; z-index: 100;
  }
  .reply-inner {
    display: flex; align-items: center; gap: 8px; width: 100%; max-width: 568px;
    background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
    border: 1px solid var(--hairline); padding: 8px;
  }
  .reply-input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 15px; color: var(--ink); font-family: inherit; min-width: 0; padding: 6px 8px;
  }
  .reply-input::placeholder { color: var(--ink-3); }
  .reply-send {
    width: 36px; height: 36px; border-radius: 50%; border: none; flex-shrink: 0;
    background: var(--info); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease;
  }
  .reply-send:active { transform: scale(0.9); }
</style>
</head>
<body>
<div class="app">
  <div class="error" id="error"></div>
  <section id="header"></section>
  <section><div class="briefing" id="briefing"></div></section>
  <section><div class="label">Today</div><div id="today"></div></section>
  <section><div class="label">The numbers</div><div class="tiles" id="numbers"></div></section>
  <section><div class="label">On my radar</div><div id="radar"></div></section>
  <footer class="footer" id="footer"></footer>
</div>

<div class="reply-bar">
  <div class="reply-inner">
    <input class="reply-input" id="replyInput" type="text" placeholder="Reply to your briefing..." enterkeyhint="send" />
    <button class="reply-send" id="replySend" title="Send">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const TZ = "Australia/Brisbane";
const CHECK = '<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

let BRIEFING = null;  // latest loaded briefing, used to build the reply context

function brisbaneNow() {
  return new Date(new Date().toLocaleString("en-US", { timeZone: TZ }));
}
function todayISO() {
  const d = brisbaneNow();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function store(key, value) {
  try {
    if (value === undefined) return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key, JSON.stringify(value));
  } catch { return null; }
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function renderHeader(b) {
  const now = brisbaneNow();
  const hour = now.getHours();
  const greeting = hour >= 17 || hour < 5 ? "Good evening" : hour >= 12 ? "Good afternoon" : "Good morning";
  const dateStr = now.toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long" });

  const isStale = b.date !== todayISO();
  const staleStr = isStale
    ? new Date(`${b.date}T12:00:00+10:00`).toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short", timeZone: TZ })
    : null;

  $("header").innerHTML = `
    <div class="date">${dateStr}</div>
    <div class="greeting">${greeting}, Christian</div>
    ${isStale ? `<div class="stale-note">This briefing was written ${staleStr} — a fresh one lands on the next update cycle.</div>` : ""}
  `;
}

function renderBriefing(b) {
  $("briefing").innerHTML = b.message.map((p) => `<p>${esc(p)}</p>`).join("");
}

function renderToday(b) {
  const key = `pa:done:${b.date}`;
  const done = store(key) || [];
  $("today").innerHTML = b.today.map((t, i) => `
    <div class="today-item lv-${t.level} ${done[i] ? "done" : ""}" data-i="${i}">
      <span class="today-check">${done[i] ? CHECK : ""}</span>
      <span class="dot"></span>
      <span class="today-text">${esc(t.text)}</span>
    </div>
  `).join("");

  $("today").querySelectorAll(".today-item").forEach((item) => {
    item.addEventListener("click", () => {
      const i = +item.dataset.i;
      const done = store(key) || [];
      done[i] = !done[i];
      store(key, done);
      item.classList.toggle("done", done[i]);
      item.querySelector(".today-check").innerHTML = done[i] ? CHECK : "";
    });
  });
}

function renderNumbers(b, whoop) {
  const tiles = [...b.numbers];

  // If WHOOP has synced within ~36h, surface recovery as a live tile.
  if (whoop && whoop.synced_at && (Date.now() - new Date(whoop.synced_at)) / 3600000 <= 36 && whoop.recovery) {
    const rec = Math.round(whoop.recovery.recovery_score);
    const level = rec >= 67 ? "good" : rec >= 34 ? "warning" : "critical";
    tiles.unshift({ label: "Recovery", value: `${rec}%`, note: "WHOOP · today", level });
  }

  $("numbers").innerHTML = tiles.map((t) => `
    <div class="tile lv-${t.level || "neutral"}">
      <div class="tile-label">${esc(t.label)}</div>
      <div class="tile-value">${esc(t.value)}</div>
      ${t.note ? `<div class="tile-note"><span class="dot"></span>${esc(t.note)}</div>` : ""}
    </div>
  `).join("");
}

function renderRadar(b) {
  $("radar").innerHTML = b.radar.map((r) => `<div class="radar-item">${esc(r)}</div>`).join("");
}

function renderFooter(b) {
  const written = new Date(b.writtenAt);
  const str = written.toLocaleString("en-AU", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit", timeZone: TZ });
  $("footer").innerHTML = `<div>Briefing written ${str}</div><div>Updates automatically — no refresh needed</div>`;
}

/* ---------- reply: opens Claude with today's full context ---------- */
function buildContext() {
  if (!BRIEFING) return "";
  const b = BRIEFING;
  const done = store(`pa:done:${b.date}`) || [];
  const todayLines = b.today.map((t, i) => `${done[i] ? "[done] " : ""}${t.text}`).join("; ");
  const numberLines = b.numbers.map((n) => `${n.label}: ${n.value}${n.note ? ` (${n.note})` : ""}`).join("; ");
  return [
    `You are my personal assistant. Today is ${b.date}. Here is my dashboard briefing you wrote me earlier:`,
    b.message.join(" "),
    `Today's list: ${todayLines}.`,
    `Numbers: ${numberLines}.`,
    `On the radar: ${b.radar.join("; ")}.`,
    `My reply:`,
  ].join("\n");
}

function setupReply() {
  const input = $("replyInput");
  const send = () => {
    const msg = input.value.trim();
    if (!msg) return;
    window.open(`https://claude.ai/new?q=${encodeURIComponent(`${buildContext()} ${msg}`)}`, "_blank");
    input.value = "";
  };
  $("replySend").addEventListener("click", send);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
}

/* ---------- load + auto-refresh ---------- */
let rendered = false;

async function refresh() {
  let briefing, whoop;
  try {
    [briefing, whoop] = await Promise.all([
      fetch("briefing.json", { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch("whoop-data.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
    ]);
  } catch (e) {
    if (!rendered) { $("error").classList.add("show"); $("error").textContent = `Couldn't load the briefing (${e.message}). Retrying automatically.`; }
    return;
  }
  $("error").classList.remove("show");
  BRIEFING = briefing;
  renderHeader(briefing);
  renderBriefing(briefing);
  renderToday(briefing);
  renderNumbers(briefing, whoop);
  renderRadar(briefing);
  renderFooter(briefing);
  rendered = true;
}

refresh();
setInterval(refresh, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refresh();
});

setupReply();

// network-first service worker keeps the installed home-screen app
// loading the live page instead of a stale cached copy
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
