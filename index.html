<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Life Dashboard</title>
<meta name="description" content="Christian's daily briefing" />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Dashboard" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" type="image/png" />

<style>
  :root {
    --bg: #FAF8F5;
    --card: #FFFFFF;
    --ink: #2C2825;
    --ink-2: #8A8279;
    --ink-3: #B5AFA8;
    --hairline: rgba(120, 100, 80, 0.14);
    --well: rgba(120, 100, 80, 0.05);
    --good: #5B9A6F;
    --warning: #C68B4B;
    --critical: #C45C4A;
    --info: #5B8DB8;
    --neutral: #B5AFA8;
    --bubble-me: #5B8DB8;
    --shadow: 0 2px 16px rgba(120, 100, 80, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171512;
      --card: #201D19;
      --ink: #EDEAE5;
      --ink-2: #9B948B;
      --ink-3: #6E675F;
      --hairline: rgba(255, 255, 255, 0.10);
      --well: rgba(255, 255, 255, 0.05);
      --good: #79B08C;
      --warning: #D9A05F;
      --critical: #D97965;
      --info: #7FA9CC;
      --neutral: #6E675F;
      --bubble-me: #3D6B94;
      --shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { -webkit-text-size-adjust: 100%; }
  html, body { background: var(--bg); overscroll-behavior-y: none; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .app {
    max-width: 620px; margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top)) 18px calc(104px + env(safe-area-inset-bottom));
  }

  section { padding: 18px 0; border-top: 1px solid var(--hairline); }
  section:first-of-type { border-top: none; padding-top: 0; }

  .label {
    font-size: 11px; font-weight: 650; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-2); margin-bottom: 12px;
  }

  .lv-good { --c: var(--good); }
  .lv-warning { --c: var(--warning); }
  .lv-critical { --c: var(--critical); }
  .lv-info { --c: var(--info); }
  .lv-neutral { --c: var(--neutral); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--neutral)); flex-shrink: 0; }

  /* ---------- header ---------- */
  .date { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
  .greeting { font-size: 23px; font-weight: 650; letter-spacing: -0.015em; margin-top: 2px; }
  .stale-note { font-size: 13px; color: var(--warning); margin-top: 8px; }

  /* ---------- briefing ---------- */
  .briefing p { font-size: 16px; line-height: 1.62; margin-bottom: 15px; }
  .briefing p:last-child { margin-bottom: 0; }

  /* ---------- today ---------- */
  .today-item {
    display: flex; align-items: flex-start; gap: 11px;
    padding: 11px 0; min-height: 44px;
    cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .today-check {
    width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--hairline);
    flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .today-item .dot { margin-top: 9px; }
  .today-text { font-size: 15px; }
  .today-item.done { opacity: 0.4; }
  .today-item.done .today-text { text-decoration: line-through; }
  .today-item.done .today-check { background: var(--good); border-color: var(--good); }

  /* ---------- numbers ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; }
  .tile { background: var(--well); border-radius: 12px; padding: 11px 13px; min-width: 0; }
  .tile-label { font-size: 11.5px; color: var(--ink-2); }
  .tile-value { font-size: 20px; font-weight: 650; margin-top: 2px; letter-spacing: -0.015em; white-space: nowrap; }
  .tile-note { font-size: 11.5px; color: var(--ink-2); margin-top: 1px; display: flex; align-items: center; gap: 5px; }
  .tile-note .dot { width: 6px; height: 6px; }

  /* ---------- radar ---------- */
  .radar-item { display: flex; gap: 10px; padding: 8px 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
  .radar-item::before { content: "—"; color: var(--ink-3); flex-shrink: 0; }

  .footer { padding-top: 18px; border-top: 1px solid var(--hairline); text-align: center; }
  .footer div { font-size: 12px; color: var(--ink-3); }

  .error {
    font-size: 13.5px; color: var(--critical); padding: 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--critical) 10%, transparent); margin-bottom: 16px; display: none;
  }
  .error.show { display: block; }

  /* ---------- ask button (briefing) ---------- */
  .fab {
    position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom));
    z-index: 60; height: 52px; padding: 0 20px; border-radius: 26px; border: none;
    background: var(--bubble-me); color: #fff; cursor: pointer;
    display: flex; align-items: center; gap: 9px;
    font-size: 15px; font-weight: 650; font-family: inherit;
    box-shadow: var(--shadow);
    transition: transform 0.14s ease, opacity 0.2s ease;
  }
  .fab:active { transform: scale(0.94); }

  /* ---------- composer (lives inside the chat panel) ---------- */
  .composer {
    flex-shrink: 0;
    padding: 8px 14px calc(10px + env(safe-area-inset-bottom));
    background: var(--bg);
    display: flex; justify-content: center;
    border-top: 1px solid var(--hairline);
  }
  .composer-inner {
    display: flex; align-items: flex-end; gap: 8px; width: 100%; max-width: 592px;
    background: var(--card); border: 1px solid var(--hairline);
    border-radius: 22px; box-shadow: var(--shadow); padding: 6px 6px 6px 8px;
  }
  .composer-input {
    flex: 1; border: none; outline: none; background: transparent; resize: none;
    font-size: 16px; /* 16px stops iOS zooming on focus */
    line-height: 1.4; font-family: inherit; color: var(--ink);
    padding: 9px 6px; max-height: 120px; min-width: 0;
  }
  .composer-input::placeholder { color: var(--ink-3); }
  .send {
    width: 36px; height: 36px; border-radius: 50%; border: none; flex-shrink: 0;
    background: var(--bubble-me); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.12s ease, opacity 0.15s ease;
  }
  .send:active { transform: scale(0.9); }
  .send:disabled { opacity: 0.35; }

  /* ---------- chat panel ---------- */
  .chat {
    position: fixed; top: 0; left: 0; right: 0; height: 100%;
    z-index: 50; background: var(--bg);
    display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform 0.28s cubic-bezier(.32,.72,0,1);
    visibility: hidden;
  }
  .chat.open { transform: translateY(0); visibility: visible; }
  .chat-head {
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--hairline); background: var(--bg);
  }
  .chat-title { font-size: 15px; font-weight: 650; flex: 1; }
  .chat-sub { font-size: 12px; color: var(--ink-2); font-weight: 400; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--well);
    color: var(--ink-2); display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .icon-btn:active { transform: scale(0.92); }
  .chat-scroll {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 16px 16px 14px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .handoff-note {
    align-self: flex-start; font-size: 13px; color: var(--ink-3);
    line-height: 1.5; padding: 4px 0;
  }
  .msg { max-width: 86%; font-size: 15.5px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
  .msg.me {
    align-self: flex-end; background: var(--bubble-me); color: #fff;
    padding: 10px 14px; border-radius: 18px 18px 4px 18px;
  }
  .msg.pa { align-self: flex-start; max-width: 100%; }
  .msg.pa strong { font-weight: 650; }
  .msg.err { align-self: flex-start; color: var(--critical); font-size: 14px; }
  .typing { display: flex; gap: 4px; align-self: flex-start; padding: 6px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3);
    animation: blink 1.3s infinite both;
  }
  .typing span:nth-child(2) { animation-delay: 0.18s; }
  .typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes blink { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }
  .chat-empty { color: var(--ink-3); font-size: 14px; text-align: center; padding: 32px 12px; line-height: 1.6; }

  /* ---------- plan chip + panel ---------- */
  .plan-chip {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 12px;
    background: var(--well); border: 1px solid var(--hairline); border-radius: 999px;
    padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--ink);
    cursor: pointer; min-height: 40px; user-select: none; -webkit-user-select: none;
  }
  .plan-chip:active { transform: scale(0.97); }
  .plan-chip .day { color: var(--info); }
  .plan-chip svg { color: var(--ink-3); }

  .plan {
    position: fixed; inset: 0; z-index: 55; background: var(--bg);
    display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform 0.28s cubic-bezier(.32,.72,0,1);
    visibility: hidden;
  }
  .plan.open { transform: translateY(0); visibility: visible; }
  .plan-scroll {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    padding: 16px 18px calc(28px + env(safe-area-inset-bottom));
  }
  .plan-lede { font-size: 15.5px; line-height: 1.6; margin-bottom: 14px; }
  .plan-lede:last-of-type { margin-bottom: 22px; }
  .plan-lede strong { font-weight: 650; }

  .plan details {
    border-top: 1px solid var(--hairline); padding: 2px 0;
  }
  .plan details[open] { padding-bottom: 14px; }
  .plan summary {
    list-style: none; cursor: pointer; padding: 15px 0;
    font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 10px;
    min-height: 44px;
  }
  .plan summary::-webkit-details-marker { display: none; }
  .plan summary::after {
    content: ""; margin-left: auto; width: 8px; height: 8px; flex-shrink: 0;
    border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3);
    transform: rotate(45deg); transition: transform 0.2s ease;
  }
  .plan details[open] summary::after { transform: rotate(-135deg); }
  .plan summary .tag { font-size: 11.5px; font-weight: 600; color: var(--ink-3); }

  .plan-body { font-size: 14.5px; line-height: 1.6; color: var(--ink-2); }
  .plan-body p { margin-bottom: 12px; }
  .plan-body p:last-child { margin-bottom: 0; }
  .plan-body strong { color: var(--ink); font-weight: 650; }
  .plan-row { display: flex; gap: 12px; padding: 9px 0; border-top: 1px solid var(--hairline); }
  .plan-row:first-child { border-top: none; }
  .plan-row .k { flex-shrink: 0; width: 62px; font-weight: 650; color: var(--ink); font-size: 13.5px; }
  .plan-list li { margin: 0 0 9px 18px; }
  .plan-list li:last-child { margin-bottom: 0; }
  .plan-warn {
    background: color-mix(in srgb, var(--critical) 10%, transparent);
    border-radius: 10px; padding: 12px 14px; color: var(--ink); font-size: 14px; line-height: 1.55;
  }
  .plan-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 8px; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="error" id="error"></div>
  <section id="header"></section>
  <section><div class="briefing" id="briefing"></div></section>
  <section><div class="label">Today</div><div id="today"></div></section>
  <section><div class="label">The numbers</div><div class="tiles" id="numbers"></div></section>
  <section><div class="label">On my radar</div><div id="radar"></div></section>
  <footer class="footer" id="footer"></footer>
</div>

<div class="plan" id="plan">
  <div class="chat-head">
    <div>
      <div class="chat-title">Content Plan</div>
      <div class="chat-sub" id="planSub"></div>
    </div>
    <button class="icon-btn" id="planClose" title="Back to briefing" aria-label="Back to briefing">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <div class="plan-scroll" id="planScroll"></div>
</div>

<div class="chat" id="chat">
  <div class="chat-head">
    <div>
      <div class="chat-title">Your assistant</div>
      <div class="chat-sub" id="chatSub">Knows today's briefing</div>
    </div>
    <button class="icon-btn" id="chatClear" title="Clear conversation" aria-label="Clear conversation">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
    </button>
    <button class="icon-btn" id="chatClose" title="Back to briefing" aria-label="Back to briefing">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <div class="chat-scroll" id="chatScroll"></div>
  <div class="composer" id="composer">
    <div class="composer-inner">
      <textarea class="composer-input" id="input" rows="1" placeholder="Ask your assistant…" enterkeyhint="send" autocapitalize="sentences"></textarea>
      <button class="send" id="send" aria-label="Send">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</div>

<button class="fab" id="fab" aria-label="Ask your assistant">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-8.5 8.5 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 014 11.5 8.5 8.5 0 0112.5 3 8.5 8.5 0 0121 11.5z"/></svg>
  Ask
</button>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const TZ = "Australia/Brisbane";
const CHECK = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

let BRIEFING = null;

function brisbaneNow() { return new Date(new Date().toLocaleString("en-US", { timeZone: TZ })); }
function todayISO() {
  const d = brisbaneNow();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function store(key, value) {
  try {
    if (value === undefined) return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key, JSON.stringify(value));
  } catch { return null; }
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
// escape first, then allow **bold** only — no raw HTML ever reaches the page
function fmt(s) { return esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>"); }

/* =========================================================
   BRIEFING
   ========================================================= */
function renderHeader(b) {
  const now = brisbaneNow();
  const hour = now.getHours();
  const greeting = hour >= 17 || hour < 5 ? "Good evening" : hour >= 12 ? "Good afternoon" : "Good morning";
  const dateStr = now.toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long" });
  const isStale = b.date !== todayISO();
  const staleStr = isStale
    ? new Date(`${b.date}T12:00:00+10:00`).toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short", timeZone: TZ })
    : null;

  $("header").innerHTML = `
    <div class="date">${dateStr}</div>
    <div class="greeting">${greeting}, Christian</div>
    ${isStale ? `<div class="stale-note">This briefing was written ${staleStr} — ask me below for anything newer.</div>` : ""}
    <div class="plan-chip" id="planChip" role="button" tabindex="0">
      <span id="planChipText">Content plan</span>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  `;
  $("planChip").addEventListener("click", openPlan);
  if (PLAN) updatePlanChip();
}

/* =========================================================
   PLAN — the 150-day content plan, its own screen
   ========================================================= */
let PLAN = null;

function dayNumber() {
  if (!PLAN) return null;
  const start = new Date(`${PLAN.startDate}T00:00:00+10:00`);
  const n = Math.floor((brisbaneNow() - start) / 86400000) + 1;
  return n;
}

function updatePlanChip() {
  const chip = $("planChipText");
  if (!chip || !PLAN) return;
  const n = dayNumber();
  chip.innerHTML = n < 1
    ? `Content plan <span class="day">· starts ${new Date(`${PLAN.startDate}T12:00:00+10:00`).toLocaleDateString("en-AU", { day: "numeric", month: "short", timeZone: TZ })}</span>`
    : n > 150
    ? `Content plan <span class="day">· complete</span>`
    : `Content plan <span class="day">· Day ${n} of 150</span>`;
}

function block(title, tag, inner) {
  return `<details><summary>${esc(title)}${tag ? `<span class="tag">${esc(tag)}</span>` : ""}</summary><div class="plan-body">${inner}</div></details>`;
}
const ul = (items) => `<ul class="plan-list">${items.map((i) => `<li>${fmt(i)}</li>`).join("")}</ul>`;

function renderPlan() {
  if (!PLAN) return;
  const p = PLAN;
  $("planSub").textContent = `${p.subtitle} · ${p.startDate} → ${p.endDate}`;

  const phases = p.spine.phases.map((ph) =>
    `<div class="plan-row"><div class="k">${esc(ph.days)}</div><div><strong>${esc(ph.name)}</strong> — ${esc(ph.focus)}<div class="plan-sub">Story: ${esc(ph.story)}</div></div></div>`
  ).join("");

  const pillars = p.pillars.map((pl) =>
    `<div class="plan-row"><div class="k">${esc(pl.share)}</div><div><strong>${esc(pl.name)}</strong> — ${esc(pl.what)}<div class="plan-sub">${esc(pl.why)}</div></div></div>`
  ).join("");

  const rhythm = p.rhythm.days.map((d) =>
    `<div class="plan-row"><div class="k">${esc(d.day)}</div><div>${esc(d.what)}</div></div>`
  ).join("");

  const banks = Object.entries(p.ideaBank).map(([name, items]) =>
    block(name, `${items.length} ideas`, ul(items))
  ).join("");

  $("planScroll").innerHTML = `
    ${p.premise.map((t) => `<p class="plan-lede">${fmt(t)}</p>`).join("")}

    ${block("The spine — " + p.spine.name, "40% of output", `
      <p>${fmt(p.spine.why)}</p>
      <p><strong>Target:</strong> ${esc(p.spine.target)}</p>
      <p>${esc(p.spine.targetNote)}</p>
      ${phases}
      <p style="margin-top:14px"><span class="plan-warn">${esc(p.spine.risk)}</span></p>
    `)}

    ${block("Content pillars", "5", pillars)}

    ${block("Making things spread", "the mechanics", `
      <p><strong>The hook</strong></p>${ul(p.virality.hook)}
      <p style="margin-top:14px"><strong>Holding them</strong></p>${ul(p.virality.retention)}
      <p style="margin-top:14px"><strong>Getting shared</strong></p>${ul(p.virality.shares)}
      <p style="margin-top:14px"><strong>Series mechanics</strong></p>${ul(p.virality.series)}
    `)}

    ${block("Weekly rhythm", "2 shoot days", `<p>${esc(p.rhythm.note)}</p>${rhythm}`)}

    ${block("Idea bank", `${Object.values(p.ideaBank).reduce((a, b) => a + b.length, 0)} ideas`, banks)}

    ${block("What to measure", "and when to quit a format", `
      <p><strong>Watch these three</strong></p>${ul(p.metrics.watch)}
      <p style="margin-top:14px"><strong>Rules</strong></p>${ul(p.metrics.rules)}
    `)}

    ${block("The money", "later, but build for it now", `<p>${esc(p.money.note)}</p>${ul(p.money.points)}`)}

    ${block("First 14 days", "get these banked", `
      <p>${esc(p.launch.note)}</p>
      <p style="margin-top:12px"><strong>Long form</strong></p>${ul(p.launch.longForm)}
      <p style="margin-top:14px"><strong>Shorts</strong></p>${ul(p.launch.shorts)}
    `)}
  `;
}

function openPlan() { $("plan").classList.add("open"); }
function closePlan() { $("plan").classList.remove("open"); }

function renderBriefing(b) {
  $("briefing").innerHTML = b.message.map((p) => `<p>${fmt(p)}</p>`).join("");
}

function renderToday(b) {
  const key = `pa:done:${b.date}`;
  const done = store(key) || [];
  $("today").innerHTML = b.today.map((t, i) => `
    <div class="today-item lv-${t.level} ${done[i] ? "done" : ""}" data-i="${i}">
      <span class="today-check">${done[i] ? CHECK : ""}</span>
      <span class="dot"></span>
      <span class="today-text">${esc(t.text)}</span>
    </div>
  `).join("");

  $("today").querySelectorAll(".today-item").forEach((item) => {
    item.addEventListener("click", () => {
      const i = +item.dataset.i;
      const d = store(key) || [];
      d[i] = !d[i];
      store(key, d);
      item.classList.toggle("done", d[i]);
      item.querySelector(".today-check").innerHTML = d[i] ? CHECK : "";
    });
  });
}

function renderNumbers(b, whoop) {
  const tiles = [...b.numbers];
  if (whoop && whoop.synced_at && (Date.now() - new Date(whoop.synced_at)) / 3600000 <= 36 && whoop.recovery) {
    const rec = Math.round(whoop.recovery.recovery_score);
    tiles.unshift({
      label: "Recovery", value: `${rec}%`, note: "WHOOP · today",
      level: rec >= 67 ? "good" : rec >= 34 ? "warning" : "critical",
    });
  }
  $("numbers").innerHTML = tiles.map((t) => `
    <div class="tile lv-${t.level || "neutral"}">
      <div class="tile-label">${esc(t.label)}</div>
      <div class="tile-value">${esc(t.value)}</div>
      ${t.note ? `<div class="tile-note"><span class="dot"></span>${esc(t.note)}</div>` : ""}
    </div>
  `).join("");
}

function renderRadar(b) {
  $("radar").innerHTML = b.radar.map((r) => `<div class="radar-item">${esc(r)}</div>`).join("");
}

function renderFooter(b) {
  const str = new Date(b.writtenAt).toLocaleString("en-AU", {
    day: "numeric", month: "short", hour: "numeric", minute: "2-digit", timeZone: TZ,
  });
  $("footer").innerHTML = `<div>Briefing written ${str}</div><div>Updates automatically — no refresh needed</div>`;
}

/* =========================================================
   CHAT — talks to /api/chat, which talks to Claude
   ========================================================= */
const chatKey = () => `pa:chat:${todayISO()}`;
let history = [];
let sending = false;

function renderChat() {
  const scroll = $("chatScroll");
  if (!history.length) {
    scroll.innerHTML = `<div class="chat-empty">Ask me anything about today.<br />I have your briefing, your bills, and your numbers in front of me.</div>`;
    return;
  }
  scroll.innerHTML = history.map((m) =>
    m.role === "user"
      ? `<div class="msg me">${esc(m.content)}</div>`
      : m.note
      ? `<div class="handoff-note">${esc(m.content)}</div>`
      : m.error
      ? `<div class="msg err">${esc(m.content)}</div>`
      : `<div class="msg pa">${fmt(m.content)}</div>`
  ).join("");
  scrollDown();
}

/* ---------- handoff: no API key, so hand the question to Claude
   with today's context attached. Costs nothing, uses your subscription. ---------- */
function handoffContext(question) {
  const b = BRIEFING;
  const day = PLAN ? dayNumber() : null;
  const out = ["You're my personal assistant. This came from my life dashboard — keep the reply short and direct, like the briefing does."];
  if (day && day >= 1 && day <= 150) out.push(`Today is Day ${day} of my 150-day content build (marathon runner → sprinter, filmed time trial on 2 Jan).`);
  if (b) {
    out.push(`Today's briefing said:\n${b.message.join("\n")}`.slice(0, 2600));
    out.push(`Today's list: ${b.today.map((t) => t.text).join(" · ")}`);
    out.push(`Numbers: ${b.numbers.map((n) => `${n.label} ${n.value}`).join(" · ")}`);
  }
  out.push(`My question: ${question}`);
  return out.join("\n\n");
}

function openHandoff(question) {
  window.open(`https://claude.ai/new?q=${encodeURIComponent(handoffContext(question))}`, "_blank");
}

function scrollDown() {
  const s = $("chatScroll");
  requestAnimationFrame(() => { s.scrollTop = s.scrollHeight; });
}

function openChat() {
  $("chat").classList.add("open");
  renderChat();
}
function closeChat() {
  $("chat").classList.remove("open");
  $("input").blur();
}

function passcode() { return store("pa:passcode") || ""; }

async function send() {
  const input = $("input");
  const text = input.value.trim();
  if (!text || sending) return;

  input.value = "";
  input.style.height = "auto";
  openChat();

  history.push({ role: "user", content: text });

  // Handoff mode: already established there's no API key on the server.
  if (store("pa:handoff")) {
    history.push({ role: "assistant", note: true, content: "Opened in Claude with today's briefing attached." });
    store(chatKey(), history);
    renderChat();
    openHandoff(text);
    return;
  }

  sending = true;
  $("send").disabled = true;
  store(chatKey(), history);
  renderChat();

  const scroll = $("chatScroll");
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerHTML = "<span></span><span></span><span></span>";
  scroll.appendChild(typing);
  scrollDown();

  let bubble = null;
  let acc = "";

  const finish = (content, isError) => {
    typing.remove();
    if (content) {
      history.push({ role: "assistant", content, ...(isError ? { error: true } : {}) });
      store(chatKey(), history);
    }
    renderChat();
    sending = false;
    $("send").disabled = false;
  };

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json", "x-dashboard-passcode": passcode() },
      body: JSON.stringify({ messages: history.filter((m) => !m.error) }),
    });

    if (res.status === 401) {
      typing.remove();
      const code = prompt("Passcode for this dashboard:");
      if (code) {
        store("pa:passcode", code);
        history.pop();
        store(chatKey(), history);
        input.value = text;
        sending = false;
        $("send").disabled = false;
        renderChat();
        return send();
      }
      return finish("Chat is locked — a passcode is needed.", true);
    }

    // No API key configured on the server — switch to handoff permanently.
    const ctype = res.headers.get("content-type") || "";
    if (res.ok && ctype.includes("application/json")) {
      const j = await res.json().catch(() => null);
      if (j && j.handoff) {
        store("pa:handoff", true);
        typing.remove();
        history.push({ role: "assistant", note: true, content: "No API key set, so I'll hand these to Claude instead — same conversation, on your subscription, no per-message cost. Opening it now." });
        store(chatKey(), history);
        renderChat();
        openHandoff(text);
        sending = false;
        $("send").disabled = false;
        return;
      }
    }

    if (!res.ok || !res.body) {
      let msg = `Couldn't reach the assistant (${res.status}).`;
      try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
      return finish(msg, true);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();

      for (const line of lines) {
        if (!line.trim()) continue;
        let evt;
        try { evt = JSON.parse(line); } catch { continue; }

        if (evt.error) return finish(evt.error, true);

        if (evt.t) {
          if (!bubble) {
            typing.remove();
            bubble = document.createElement("div");
            bubble.className = "msg pa";
            scroll.appendChild(bubble);
          }
          acc += evt.t;
          bubble.innerHTML = fmt(acc);
          scrollDown();
        }
      }
    }

    if (bubble) bubble.remove();
    finish(acc.trim() || "No reply came back — try again.", !acc.trim());
  } catch (err) {
    finish(`Connection dropped: ${err.message}`, true);
  }
}

function setupChat() {
  const input = $("input");

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $("fab").addEventListener("click", () => {
    openChat();
    setTimeout(() => input.focus(), 300);
  });
  $("send").addEventListener("click", send);
  $("chatClose").addEventListener("click", closeChat);
  $("planClose").addEventListener("click", closePlan);
  $("chatClear").addEventListener("click", () => {
    history = [];
    store(chatKey(), history);
    renderChat();
  });

  history = store(chatKey()) || [];

  // Shrink the chat panel to the visible area so the keyboard never covers
  // the composer or the last message on iOS.
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const fit = () => {
      const chat = $("chat");
      chat.style.height = `${vv.height}px`;
      chat.style.top = `${vv.offsetTop}px`;
      if (chat.classList.contains("open")) scrollDown();
    };
    vv.addEventListener("resize", fit);
    vv.addEventListener("scroll", fit);
    fit();
  }
}

/* =========================================================
   LOAD + AUTO-REFRESH
   ========================================================= */
let rendered = false;

async function refresh() {
  let briefing, whoop, plan;
  try {
    [briefing, whoop, plan] = await Promise.all([
      fetch("briefing.json", { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch("whoop-data.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      fetch("plan.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
    ]);
  } catch (e) {
    if (!rendered) { $("error").classList.add("show"); $("error").textContent = `Couldn't load the briefing (${e.message}). Retrying automatically.`; }
    return;
  }
  $("error").classList.remove("show");
  BRIEFING = briefing;
  if (plan) { PLAN = plan; renderPlan(); }
  renderHeader(briefing);
  renderBriefing(briefing);
  renderToday(briefing);
  renderNumbers(briefing, whoop);
  renderRadar(briefing);
  renderFooter(briefing);
  $("chatSub").textContent = briefing.date === todayISO() ? "Knows today's briefing" : "Knows your last briefing";
  rendered = true;
}

refresh();
setInterval(refresh, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refresh();
});

setupChat();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
