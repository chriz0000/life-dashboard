name: Daily dashboard refresh

on:
  schedule:
    # 19:50 UTC = 05:50 Brisbane. GitHub can delay scheduled runs by 10-15 min
    # under load, so this aims early to land near 6am.
    - cron: "50 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log everything, write nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh briefing from Todoist
        env:
          TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/daily.mjs

      # always(): when a connector is missing the refresh step now exits 1 so the
      # run goes red, but the briefing it wrote is still honest ("not checked")
      # and should reach the dashboard. Without always() the red run would also
      # silently stop publishing, which is the worse failure.
      - name: Commit and push
        if: ${{ always() && !inputs.dry_run }}
        run: |
          if git diff --quiet -- briefing.json; then
            echo "No change to briefing.json — nothing to push."
            exit 0
          fi
          git config user.name  "life-dashboard bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefing.json
          git commit -m "Daily refresh: $(TZ=Australia/Brisbane date '+%-d %b %Y')"
          git push
